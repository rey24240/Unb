<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="./unb/index.css">
</head>
<body>
<div class="page-bg"></div>
<div class="page-transition show" id="pageTransition" aria-hidden="true"><div class="transition-brand"><i class="bi bi-controller"></i><span>Unblocked <b>Games</b></span></div><div class="transition-spinner"></div><p>Loading your library...</p></div>

<header class="site-header">
  <a class="brand" href="/index.html" aria-label="Home">
    <span class="brand-mark"><i class="bi bi-controller"></i></span>
    <span>UNBLOCKED GAMES!!</span>
  </a>
  <div class="header-spacer"></div>
  <input id="loadDataInput" type="file" accept="application/json,.json" hidden>
  <button class="nav-icon-btn" id="settingsBtn" type="button" title="Settings" aria-label="Settings">
    <i class="bi bi-gear-fill"></i>
  </button>
</header>

<div class="settings-popover" id="settingsPopover" hidden>
  <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-popover-head">
      <div><strong id="settingsTitle">Settings</strong><small>Personalize your library</small></div>
      <button id="settingsClose" type="button" aria-label="Close settings"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="settings-row">
      <span><i class="bi bi-palette-fill"></i> Accent color</span>
      <select id="accentSelect" aria-label="Accent color">
        <option value="green">Green</option><option value="purple">Purple</option><option value="blue">Blue</option><option value="red">Red</option><option value="amber">Amber</option>
      </select>
    </div>
    <div class="settings-row">
      <span><i class="bi bi-shield-check"></i> Proxy engine</span>
      <select id="proxySelect" aria-label="Proxy engine">
        <option value="utopia">Utopia / Ultraviolet</option><option value="direct">Direct / No proxy</option>
      </select>
    </div>
    <div class="settings-row">
      <span><i class="bi bi-search"></i> Search engine</span>
      <select id="searchEngineSelect" aria-label="Search engine">
        <option value="google">Google</option><option value="bing">Bing</option><option value="duckduckgo">DuckDuckGo</option><option value="brave">Brave Search</option>
      </select>
    </div>
    <div class="settings-data-actions">
      <button class="settings-link" id="loadDataBtn" type="button"><i class="bi bi-upload"></i> Import Data</button>
      <button class="settings-link" id="saveDataBtn" type="button"><i class="bi bi-download"></i> Export Data</button>
    </div>
    <button class="settings-link" id="homeSettingsBtn" type="button"><i class="bi bi-house-fill"></i> Home</button>
  </section>
</div>

<main class="content">
  <section class="hero">
    <div>
      <div class="eyebrow" id="eyebrow">GAMES</div>
      <h1 id="pageTitle">Library</h1>
      <p id="pageSubtitle">Find a game, search by category, or save your favorites.</p>
    </div>
    <div class="result-count"><span id="resultCount">0</span> results</div>
  </section>

  <section class="content-tabs" aria-label="Library views">
    <button class="content-tab active" data-view="games" type="button"><i class="bi bi-controller"></i> All Games</button>
    <button class="content-tab" data-view="favorites" type="button"><i class="bi bi-heart"></i> Favorite Games <span id="favoriteCount" class="favorite-count">0</span></button>
    <button class="content-tab" data-view="apps" type="button"><i class="bi bi-grid-1x2-fill"></i> Apps</button>
  </section>

  <section class="catalog-tools" aria-label="Search and filters">
    <label class="catalog-search">
      <i class="bi bi-search" aria-hidden="true"></i>
      <input id="catalogSearch" type="search" placeholder="Search through games..." autocomplete="off" aria-label="Search games">
    </label>
    <label class="category-wrap" title="Choose a category">
      <i class="bi bi-funnel"></i>
      <select id="categorySelect" aria-label="Category">
        <option value="All">All Categories</option>
      </select>
    </label>
  </section>

  <section id="grid" class="card-grid" aria-live="polite"></section>
  <div id="emptyState" class="empty-state" hidden>
    <i class="bi bi-search"></i>
    <h2>Nothing found</h2>
    <p>Try another search or category.</p>
  </div>
</main>

<div id="gameModal" class="game-modal" hidden role="dialog" aria-modal="true" aria-labelledby="gameModalTitle">
  <div class="game-modal-window">
    <div class="game-modal-bar"><strong id="gameModalTitle">Playing game</strong><div class="game-modal-actions"><button id="gameFullscreen" type="button" aria-label="Fullscreen"><i class="bi bi-fullscreen"></i></button><button id="gameClose" type="button" aria-label="Close game"><i class="bi bi-x-lg"></i><span>Close</span></button></div></div>
    <iframe id="gameModalFrame" title="Game" frameborder="0" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope; web-share" allowfullscreen referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<script>
const state = { games: [], apps: [], view: 'games', favorites: new Set() };
const pageTransition = document.getElementById('pageTransition');
const grid = document.getElementById('grid');
const catalogSearch = document.getElementById('catalogSearch');
const categorySelect = document.getElementById('categorySelect');
const resultCount = document.getElementById('resultCount');
const favoriteCount = document.getElementById('favoriteCount');
const emptyState = document.getElementById('emptyState');
const pageTitle = document.getElementById('pageTitle');
const pageSubtitle = document.getElementById('pageSubtitle');
const eyebrow = document.getElementById('eyebrow');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPopover = document.getElementById('settingsPopover');
const settingsClose = document.getElementById('settingsClose');
const accentSelect = document.getElementById('accentSelect');
const proxySelect = document.getElementById('proxySelect');
const searchEngineSelect = document.getElementById('searchEngineSelect');
const saveDataBtn = document.getElementById('saveDataBtn');
const loadDataBtn = document.getElementById('loadDataBtn');
const loadDataInput = document.getElementById('loadDataInput');
const homeSettingsBtn = document.getElementById('homeSettingsBtn');

function escapeHTML(value='') {
  return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
function faviconFor(url) {
  try { return `https://www.google.com/s2/favicons?sz=128&domain=${encodeURIComponent(new URL(url).hostname)}`; }
  catch (_) { return ''; }
}
function loadFavorites() {
  try {
    const saved = JSON.parse(localStorage.getItem('ug_favorites') || '[]');
    state.favorites = new Set(Array.isArray(saved) ? saved : []);
  } catch (_) { state.favorites = new Set(); }
  updateFavoriteCount();
}
function saveFavorites() {
  localStorage.setItem('ug_favorites', JSON.stringify([...state.favorites]));
  updateFavoriteCount();
}
function updateFavoriteCount() { favoriteCount.textContent = state.favorites.size; }
function currentItems() {
  if (state.view === 'apps') return state.apps;
  if (state.view === 'favorites') return [...state.games, ...state.apps].filter(x => state.favorites.has(x.url));
  return state.games;
}
function populateCategories() {
  const values = new Set();
  [...state.games, ...state.apps].forEach(item => (item.categories || []).forEach(c => values.add(c)));
  categorySelect.innerHTML = '<option value="All">All categories</option>' +
    [...values].sort((a,b)=>a.localeCompare(b)).map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('');
}
function selectedSearchEngine() {
  const key = localStorage.getItem('ug_search_engine') || 'google';
  return ['google','bing','duckduckgo','brave'].includes(key) ? key : 'google';
}
function webSearchUrl(query) {
  const engines = {
    google: q => `https://www.google.com/search?q=${encodeURIComponent(q)}`,
    bing: q => `https://www.bing.com/search?q=${encodeURIComponent(q)}`,
    duckduckgo: q => `https://duckduckgo.com/?q=${encodeURIComponent(q)}`,
    brave: q => `https://search.brave.com/search?q=${encodeURIComponent(q)}`
  };
  const engine = selectedSearchEngine();
  return engines[engine] ? engines[engine](query) : engines.google(query);
}
function updateHeader() {
  const favoriteMode = state.view === 'favorites';
  const appMode = state.view === 'apps';
  const label = appMode ? 'APPS' : favoriteMode ? 'FAVORITES' : 'GAMES';
  eyebrow.textContent = label;
  if (pageTitle) pageTitle.textContent = appMode ? 'Browse Apps' : favoriteMode ? 'Your Favorites' : 'Library';
  pageSubtitle.textContent = favoriteMode ? 'Your saved games and apps are right here.' : appMode ? 'Browse apps through the same unblocking player.' : 'Find a game or save your favorites.';
  catalogSearch.placeholder = appMode ? 'Search through apps...' : favoriteMode ? 'Search your favorites...' : 'Search through games...';
  catalogSearch.setAttribute('aria-label', appMode ? 'Search apps' : favoriteMode ? 'Search favorites' : 'Search games');
  const hideCategory = appMode || favoriteMode;
  document.querySelector('.category-wrap').hidden = hideCategory;
  categorySelect.disabled = hideCategory;
}
function cardHTML(item, isApp) {
  const url = escapeHTML(item.url || '');
  const name = escapeHTML(item.name || 'Untitled');
  const useProxy = item.proxy === true || item.proxy === 'true' || item.proxy === undefined;
  const cats = (item.categories || []).join(' • ') || (isApp ? 'App' : 'Game');
  const image = escapeHTML(item.image || item.thumbnail || faviconFor(item.url));
  const fallbackImage = escapeHTML(faviconFor(item.url.startsWith('http') ? item.url : `${location.origin}${item.url}`));
  const rawBadge = String(item.badge || '').trim();
  const normalizedBadge = rawBadge.toLowerCase();
  const badgeTone = /(popular|fire|hot|trending|featured)/i.test(normalizedBadge)
    ? 'popular'
    : /(new|limited|fresh)/i.test(normalizedBadge)
      ? 'new'
      : 'default';
  const badgeText = escapeHTML(rawBadge.replace(/[\u{1F300}-\u{1FAFF}]/gu, '').trim());
  const badgeIcon = badgeTone === '' ? '' :   '' ? '' : '';
  const badge = badgeText ? `<span class="card-badge ${badgeTone}"><i class="bi ${badgeIcon}"></i>${badgeText}</span>` : '';
  return `<article class="game-card" data-url="${url}" data-name="${name}" data-proxy="${useProxy}" tabindex="0" role="button">
    <div class="card-image">
      <img src="${image}" alt="${name}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImage}'">
      <div class="play-overlay"><i class="bi bi-play-fill"></i></div>
      ${badge}
    </div>
    <div class="card-body">
      <h2>${name}</h2>
      <p>${escapeHTML(cats)}</p>
    </div>
  </article>`;
}
function render() {
  updateHeader();
  let items = currentItems();
  const category = categorySelect.value;
  const query = catalogSearch.value.trim().toLowerCase();

  const filtered = items.filter(item => {
    const matchesCategory = state.view === 'favorites' || category === 'All' || (item.categories || []).includes(category);
    const searchable = `${item.name || ''} ${(item.categories || []).join(' ')}`.toLowerCase();
    return matchesCategory && searchable.includes(query);
  });
  grid.innerHTML = filtered.map(item => cardHTML(item, state.view === 'apps' || (state.view === 'favorites' && state.apps.some(a => a.url === item.url)))).join('');
  resultCount.textContent = filtered.length;
  emptyState.hidden = filtered.length !== 0;
  emptyState.innerHTML = '<i class="bi bi-search"></i><h2>Nothing found</h2><p>Try another search or category.</p>';
  document.querySelectorAll('.content-tab[data-view]').forEach(btn => btn.classList.toggle('active', btn.dataset.view === state.view));
}
function openItem(card) {
  const isApp = state.view === 'apps' || (state.view === 'favorites' && state.apps.some(a => a.url === card.dataset.url));
  const type = isApp ? 'app' : 'game';
  const useProxy = card.dataset.proxy !== 'false';
  const player = 'player-file.html';
  const source = useProxy ? 'url' : 'file';
  const query = `type=${type}&${source}=${encodeURIComponent(card.dataset.url)}&proxy=${useProxy}&title=${encodeURIComponent(card.dataset.name || 'Game')}`;
  openPlayerTab(`/unb/${player}?${query}`, card.dataset.name || 'Game');
}
function openPlayerTab(playerUrl, title) {
  const playerTab = window.open('about:blank', '_blank');
  if (!playerTab) {
    alert('Please allow pop-ups to open games in a new tab.');
    return;
  }
  const playerDocument = playerTab.document;
  playerDocument.documentElement.style.cssText = 'width:100%;height:100%;';
  playerDocument.body.style.cssText = 'display:flex;flex-direction:column;width:100%;height:100%;margin:0;overflow:hidden;background:#05090f;color:#edf4ff;font:600 14px system-ui,sans-serif;';
  playerDocument.title = title;
  const bar = playerDocument.createElement('header');
  bar.style.cssText = 'display:flex;flex:none;align-items:center;justify-content:space-between;gap:12px;height:44px;padding:0 14px;background:#111923;border-bottom:1px solid #293d55;';
  const titleElement = playerDocument.createElement('strong');
  titleElement.textContent = title;
  titleElement.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
  const closeButton = playerDocument.createElement('button');
  closeButton.type = 'button';
  closeButton.textContent = 'Close tab';
  closeButton.style.cssText = 'border:1px solid #293d55;border-radius:8px;background:#1b2a3c;color:#edf4ff;padding:7px 12px;font:inherit;cursor:pointer;';
  closeButton.addEventListener('click', () => playerTab.close());
  const actions = playerDocument.createElement('div');
  actions.style.cssText = 'display:flex;gap:8px;flex:none;';
  const refreshButton = playerDocument.createElement('button');
  refreshButton.type = 'button';
  refreshButton.textContent = 'Refresh';
  const fullscreenButton = playerDocument.createElement('button');
  fullscreenButton.type = 'button';
  fullscreenButton.textContent = 'Fullscreen';
  for (const button of [refreshButton, fullscreenButton]) {
    button.style.cssText = closeButton.style.cssText;
  }
  refreshButton.addEventListener('click', () => { playerFrame.src = playerUrl; });
  fullscreenButton.addEventListener('click', () => {
    if (playerFrame.requestFullscreen) playerFrame.requestFullscreen().catch(error => console.error('Could not enter fullscreen:', error));
  });
  actions.append(refreshButton, fullscreenButton, closeButton);
  bar.append(titleElement, actions);
  const playerFrame = playerDocument.createElement('iframe');
  playerFrame.title = title;
  playerFrame.allow = 'fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope; web-share';
  playerFrame.allowFullscreen = true;
  playerFrame.referrerPolicy = 'no-referrer';
  playerFrame.style.cssText = 'display:block;flex:1;width:100%;min-height:0;border:0;background:#000;';
  playerFrame.src = playerUrl;
  playerDocument.body.replaceChildren(bar, playerFrame);
}

document.querySelectorAll('.content-tab[data-view]').forEach(btn => btn.addEventListener('click', () => {
  const changingToApps = btn.dataset.view === 'apps' && state.view !== 'apps';
  if (changingToApps) {
    pageTransition.classList.add('show');
    window.setTimeout(() => {
      state.view = btn.dataset.view;
      window.history.replaceState(null, '', `#${state.view}`);
      render();
      pageTransition.classList.remove('show');
    }, 180);
    return;
  }
  state.view = btn.dataset.view; window.history.replaceState(null, '', `#${state.view}`);
  if (state.view !== 'favorites' && state.view !== 'apps') categorySelect.value = 'All';
  render();
}));
categorySelect.addEventListener('change', render);
catalogSearch.addEventListener('input', render);

grid.addEventListener('click', e => {
  const card = e.target.closest('.game-card');
  if (card) openItem(card);
});
grid.addEventListener('keydown', e => {
  const card = e.target.closest('.game-card');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openItem(card); }
});

const gameModal = document.getElementById('gameModal');
const gameFrame = document.getElementById('gameModalFrame');
function closeGameModal() {
  gameModal.hidden = true;
  gameFrame.onload = null;
  gameFrame.src = 'about:blank';
  document.body.classList.remove('game-modal-open');
}
document.getElementById('gameClose').addEventListener('click', closeGameModal);
gameModal.addEventListener('click', event => { if (event.target === gameModal) closeGameModal(); });
document.getElementById('gameFullscreen').addEventListener('click', () => {
  if (gameFrame.requestFullscreen) gameFrame.requestFullscreen().catch(() => {});
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !gameModal.hidden) closeGameModal();
  if (event.key === 'Escape' && !settingsPopover.hidden) settingsPopover.hidden = true;
});

const hashView = location.hash.replace('#','');
if (['games','apps','favorites'].includes(hashView)) state.view = hashView;

Promise.all([
  fetch('./unb/miscG.json').then(r => r.ok ? r.json() : []).catch(() => []),
  fetch('./unb/apps.json').then(r => r.ok ? r.json() : []).catch(() => [])
]).then(([games, apps]) => {
  state.games = Array.isArray(games) ? games : [];
  state.apps = Array.isArray(apps) ? apps : [];
  loadFavorites(); populateCategories(); render();
}).finally(() => pageTransition.classList.remove('show'));

// Keep the selected accent color used by the rest of the site.
const theme = localStorage.getItem('ug_theme') || 'green';
document.documentElement.dataset.theme = theme;
accentSelect.value = theme;
settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  settingsPopover.hidden = !settingsPopover.hidden;
});
settingsClose.addEventListener('click', () => { settingsPopover.hidden = true; });
settingsPopover.addEventListener('click', event => { if (event.target === settingsPopover) settingsPopover.hidden = true; });
homeSettingsBtn.addEventListener('click', () => { state.view = 'games'; categorySelect.value='All'; settingsPopover.hidden=true; render(); window.scrollTo({top:0,behavior:'smooth'}); });
accentSelect.addEventListener('change', () => {
  const value = accentSelect.value;
  document.documentElement.dataset.theme = value;
  localStorage.setItem('ug_theme', value);
});
const savedProxy = localStorage.getItem('ug_proxy') || 'utopia';
const savedSearchEngine = localStorage.getItem('ug_search_engine') || 'google';
proxySelect.value = ['utopia','direct'].includes(savedProxy) ? savedProxy : 'utopia';
searchEngineSelect.value = ['google','bing','duckduckgo','brave'].includes(savedSearchEngine) ? savedSearchEngine : 'google';
proxySelect.addEventListener('change', () => localStorage.setItem('ug_proxy', proxySelect.value));
searchEngineSelect.addEventListener('change', () => localStorage.setItem('ug_search_engine', searchEngineSelect.value));

function collectSaveData() {
  return {
    format: 'unblocked-games-save',
    version: 1,
    savedAt: new Date().toISOString(),
    favorites: [...state.favorites],
    settings: {
      theme: localStorage.getItem('ug_theme') || 'green',
      proxy: localStorage.getItem('ug_proxy') || 'utopia',
      searchEngine: localStorage.getItem('ug_search_engine') || 'google'
    }
  };
}
saveDataBtn.addEventListener('click', () => {
  const data = collectSaveData();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'unblocked-games-data.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
loadDataBtn.addEventListener('click', () => loadDataInput.click());
loadDataInput.addEventListener('change', async () => {
  const file = loadDataInput.files?.[0];
  loadDataInput.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.format !== 'unblocked-games-save' || data.version !== 1) throw new Error('This is not a valid site save file.');
    if (!Array.isArray(data.favorites) || !data.favorites.every(x => typeof x === 'string')) throw new Error('Favorites data is invalid.');
    const settings = data.settings || {};
    const themes = ['green','purple','blue','red','amber'];
    const proxies = ['utopia','direct'];
    const engines = ['google','bing','duckduckgo','brave'];
    if (settings.theme && !themes.includes(settings.theme)) throw new Error('Invalid theme in save file.');
    if (settings.proxy && !proxies.includes(settings.proxy)) throw new Error('Invalid proxy setting in save file.');
    if (settings.searchEngine && !engines.includes(settings.searchEngine)) throw new Error('Invalid search engine in save file.');
    state.favorites = new Set(data.favorites);
    saveFavorites();
    if (settings.theme) { localStorage.setItem('ug_theme', settings.theme); document.documentElement.dataset.theme = settings.theme; accentSelect.value = settings.theme; }
    if (settings.proxy) { localStorage.setItem('ug_proxy', settings.proxy); proxySelect.value = settings.proxy; }
    if (settings.searchEngine) { localStorage.setItem('ug_search_engine', settings.searchEngine); searchEngineSelect.value = settings.searchEngine; }
    render();
    alert('Data loaded successfully.');
  } catch (err) {
    alert(err.message || 'Could not load that save file.');
  }
});
document.addEventListener('click', (e) => {
  if (!settingsPopover.hidden && e.target !== settingsBtn && !settingsBtn.contains(e.target) && !settingsPopover.contains(e.target)) settingsPopover.hidden = true;
});
</script>
</body>
</html>
