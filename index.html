<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0ea">
  <title>Desk Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./calculator.css">
  <script src="./calculator.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="Desk Calculator home"><span class="wordmark-mark">+</span> DESK / 01</a>
    </header>

    <section class="calculator" aria-label="Calculator">
      <button class="tap-counter" id="tapCounter" type="button" aria-label="Click counter">
        <span class="tap-counter-label">TAPS</span><span id="clickCount" aria-live="polite">0</span>
      </button>
      <div class="calculator-heading">
        <div><p class="eyebrow">EVERYDAY TOOL</p><h1>Calculator</h1></div>
      </div>
      <div class="screen" aria-live="polite" aria-atomic="true">
        <div class="screen-expression" id="expression">&nbsp;</div>
        <output class="screen-value" id="display" aria-label="Display">0</output>
      </div>
      <div class="keypad" aria-label="Calculator keys">
        <button class="key utility" data-action="clear" type="button" aria-label="Clear">AC</button>
        <button class="key utility" data-action="sign" type="button" aria-label="Change sign">+/−</button>
        <button class="key utility" data-action="percent" type="button" aria-label="Percent">%</button>
        <button class="key operator" data-operation="divide" type="button" aria-label="Divide">÷</button>
        <button class="key" data-digit="7" type="button">7</button>
        <button class="key" data-digit="8" type="button">8</button>
        <button class="key" data-digit="9" type="button">9</button>
        <button class="key operator" data-operation="multiply" type="button" aria-label="Multiply">×</button>
        <button class="key" data-digit="4" type="button">4</button>
        <button class="key" data-digit="5" type="button">5</button>
        <button class="key" data-digit="6" type="button">6</button>
        <button class="key operator" data-operation="subtract" type="button" aria-label="Subtract">−</button>
        <button class="key" data-digit="1" type="button">1</button>
        <button class="key" data-digit="2" type="button">2</button>
        <button class="key" data-digit="3" type="button">3</button>
        <button class="key operator" data-operation="add" type="button" aria-label="Add">+</button>
        <button class="key utility backspace" data-action="backspace" type="button" aria-label="Delete last digit">⌫</button>
        <button class="key" data-digit="0" type="button">0</button>
        <button class="key" data-action="decimal" type="button" aria-label="Decimal point">.</button>
        <button class="key equals" data-action="equals" type="button" aria-label="Equals">=</button>
      </div>
      <p class="keyboard-hint">Keyboard ready <span>·</span> 0–9, + − × ÷, Enter, Backspace</p>
    </section>
    <footer class="footer"><span>MADE FOR QUICK MATH</span><span>YOUR CALCULATIONS STAY HERE</span></footer>
  </main>
</body>
</html>
