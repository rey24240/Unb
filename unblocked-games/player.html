<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Player — Unblocked Games</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
<style>
:root{--player-accent:#4ade80;--player-accent2:#22c55e;--player-rgb:74,222,128}
html[data-theme=purple]{--player-accent:#a879ff;--player-accent2:#7b5bff;--player-rgb:168,121,255}
html[data-theme=blue]{--player-accent:#38bdf8;--player-accent2:#0ea5e9;--player-rgb:56,189,248}
html[data-theme=red]{--player-accent:#f87171;--player-accent2:#ef4444;--player-rgb:248,113,113}
html[data-theme=amber]{--player-accent:#fbbf24;--player-accent2:#f59e0b;--player-rgb:251,191,36}
body{margin:0;background:radial-gradient(circle at 50% 5%,rgba(var(--player-rgb),.12),transparent 35%),linear-gradient(145deg,#101722,#182437 48%,#24364e);color:#eef2f8;padding-bottom:82px}
.player-page{min-height:calc(100vh - 82px);padding:22px 22px 26px}.player-wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:160px minmax(0,1fr) 160px;gap:16px;align-items:start}
.side-games{display:flex;flex-direction:column;gap:12px}.side-game{display:block;color:#fff;text-decoration:none;background:#111923;border:1px solid rgba(255,255,255,.12);border-radius:13px;overflow:hidden;transition:.15s}.side-game:hover{border-color:var(--player-accent);transform:translateY(-2px)}.side-game img{width:100%;height:92px;object-fit:cover;display:block;background:#070a0e}.side-game span{display:block;padding:8px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-card{background:rgba(10,15,22,.7);border:1px solid rgba(var(--player-rgb),.18);border-radius:18px;overflow:hidden;box-shadow:0 24px 70px #0008}.frame{position:relative;aspect-ratio:16/9;background:rgba(var(--player-rgb),.08)}.frame iframe{width:100%;height:100%;border:0;display:block}.loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:linear-gradient(145deg,rgba(20,29,42,.98),rgba(var(--player-rgb),.12));color:#eef2f8}.loading .inner{text-align:center}.spinner{width:42px;height:42px;border:3px solid #ffffff22;border-top-color:var(--player-accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 13px}@keyframes spin{to{transform:rotate(360deg)}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:rgba(var(--player-rgb),.10);border-top:1px solid rgba(var(--player-rgb),.16);color:#eef2f8}.titleline{display:flex;align-items:center;gap:9px;min-width:0}.titleline img{width:28px;height:28px;border-radius:7px}.titleline strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.titleline small{display:block;color:#9ba8b8;font-size:11px}.actions{display:flex;gap:7px;align-items:center}.action{height:38px;border:1px solid rgba(var(--player-rgb),.28);border-radius:10px;background:rgba(var(--player-rgb),.06);color:#dce6ef;cursor:pointer;padding:0 13px;font:700 12px inherit}.action:hover,.action.active{border-color:var(--player-accent);color:var(--player-accent);background:rgba(var(--player-rgb),.12)}.round{width:38px;height:38px;border:1px solid rgba(var(--player-rgb),.28);border-radius:10px;background:rgba(var(--player-rgb),.06);color:#dce6ef;cursor:pointer}.round:hover{border-color:var(--player-accent);color:var(--player-accent)}
.player-bottom-nav{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:50;display:flex;justify-content:center;align-items:center;gap:6px;padding:0 14px;background:rgba(13,17,23,.94);backdrop-filter:blur(18px);border-top:1px solid rgba(var(--player-rgb),.22);box-shadow:0 -12px 35px #0006}.player-bottom-nav a{min-width:105px;height:46px;padding:0 14px;border-radius:12px;color:#9ca8b8;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font:700 13px Rubik,system-ui;transition:.15s}.player-bottom-nav a:hover,.player-bottom-nav a.active{color:#fff;background:rgba(var(--player-rgb),.12);border:1px solid rgba(var(--player-rgb),.3)}.player-bottom-nav a.active i{color:var(--player-accent)}.player-bottom-nav i{font-size:17px}
@media(max-width:1050px){.player-wrap{grid-template-columns:1fr}.side-games{display:none}.player-page{padding:14px 12px 20px}.player-card{max-width:1100px;margin:auto}}
@media(max-width:700px){body{padding-bottom:74px}.player-bottom-nav{height:62px;gap:2px;padding:0 5px}.player-bottom-nav a{min-width:0;flex:1;height:44px;padding:0 5px;font-size:10px;flex-direction:column;gap:3px}.player-bottom-nav i{font-size:16px}.bar{padding:9px}.action{height:36px;padding:0 9px}.round{width:36px;height:36px}}
</style>
</head>
<body id="playerBody">
<main class="player-page"><div class="player-wrap">
 <aside class="side-games" id="leftGames"></aside>
 <section>
  <div class="player-card">
   <div class="frame"><div class="loading" id="loading"><div class="inner"><div class="spinner"></div><div id="loadingText">Loading game...</div></div></div><iframe id="playerFrame" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope; web-share" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></div>
   <div class="bar" id="bar"><div class="titleline"><img id="favicon" alt=""><div><strong id="title">Loading...</strong><small>Hosted externally</small></div></div><div class="actions"><button class="action" id="favoriteBtn" type="button"><i class="bi bi-star"></i> Favorite</button><button class="round" id="refreshBtn" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button><button class="round" id="fullscreenBtn" title="Fullscreen"><i class="bi bi-arrows-fullscreen"></i></button></div></div>
  </div>
 </section>
 <aside class="side-games" id="rightGames"></aside>
</div></main>
<nav class="player-bottom-nav" aria-label="Main navigation">
 <a href="../index.html" data-nav="home"><i class="bi bi-house-fill"></i><span>Home</span></a>
 <a href="../index.html#games" data-nav="games"><i class="bi bi-controller"></i><span>Games</span></a>
 <a href="../index.html#new" data-nav="new"><i class="bi bi-stars"></i><span>New</span></a>
 <a href="../index.html#popular" data-nav="popular"><i class="bi bi-fire"></i><span>Popular</span></a>
 <a href="../index.html#favorites" data-nav="favorites"><i class="bi bi-heart"></i><span>Favorites</span></a>
 <a href="../index.html#apps" data-nav="apps"><i class="bi bi-grid-1x2-fill"></i><span>Apps</span></a>
 <a href="../index.html" data-nav="settings"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
</nav>
<script>
const params=new URLSearchParams(location.search);const type=params.get('type')==='app'?'app':'game';const target=params.get('url')||'https://www.google.com';const title=decodeURIComponent(params.get('title')||'Player');
const $=id=>document.getElementById(id), frame=$('playerFrame'), loading=$('loading');
const theme=localStorage.getItem('ug_theme')||'green';document.documentElement.setAttribute('data-theme',theme);
$('title').textContent=title;
try{$('favicon').src='https://www.google.com/s2/favicons?sz=128&domain='+encodeURIComponent(new URL(target).hostname)}catch{}
const favs=()=>new Set(JSON.parse(localStorage.getItem('ug_favorites')||'[]'));
function renderFavorite(){const saved=favs().has(target);$('favoriteBtn').classList.toggle('active',saved);$('favoriteBtn').innerHTML=`<i class="bi ${saved?'bi-star-fill':'bi-star'}"></i> ${saved?'Favorited':'Favorite'}`}
$('favoriteBtn').onclick=()=>{const s=favs();s.has(target)?s.delete(target):s.add(target);localStorage.setItem('ug_favorites',JSON.stringify([...s]));renderFavorite()};renderFavorite();
function setLoading(show,text='Loading game...'){$('loadingText').textContent=type==='app'?'Loading app...':text;loading.style.display=show?'grid':'none'}
async function startProxy(){const mode=localStorage.getItem('ug_proxy')||'utopia';setLoading(true);if(mode!=='utopia'){frame.src=target;return}try{await navigator.serviceWorker.register(new URL('../sw.js',location.href),{scope:'/'});if(!navigator.serviceWorker.controller){navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});return}const s=await importUV();frame.src=s.prefix+s.encodeUrl(target)}catch(e){frame.src=target}}
function importUV(){return new Promise((resolve,reject)=>{if(window.__uv$config)return resolve(window.__uv$config);const a=document.createElement('script'),b=document.createElement('script');a.src='../uv/uv.bundle.js';b.src='../uv/uv.config.js';b.onload=()=>window.__uv$config?resolve(window.__uv$config):reject(new Error('UV config unavailable'));b.onerror=reject;document.head.append(a,b);a.onload=()=>{}})}
frame.addEventListener('load',()=>setLoading(false));$('refreshBtn').onclick=()=>{setLoading(true,'Reloading game...');try{frame.contentWindow.location.reload()}catch{frame.src=frame.src}};$('fullscreenBtn').onclick=()=>frame.requestFullscreen?.();
async function loadSideGames(){if(type!=='game')return;try{const list=await fetch('games.json').then(r=>r.json());const others=list.filter(g=>g.url!==target).sort(()=>Math.random()-.5).slice(0,8);function card(g){const img=g.thumbnail||'https://www.google.com/s2/favicons?sz=128&domain='+encodeURIComponent(new URL(g.url).hostname);return `<a class="side-game" href="player.html?type=game&url=${encodeURIComponent(g.url)}&title=${encodeURIComponent(g.name)}"><img src="${img}" alt=""><span>${String(g.name).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}</span></a>`} $('leftGames').innerHTML=others.slice(0,4).map(card).join('');$('rightGames').innerHTML=others.slice(4).map(card).join('')}catch{}}
document.querySelectorAll('.player-bottom-nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav=== (type==='app'?'apps':'games')));
startProxy();loadSideGames();
</script>
</body></html>
