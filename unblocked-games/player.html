<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Player — Unblocked Games</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
<style>
:root{--player-accent:#4ade80;--player-accent2:#22c55e;--player-rgb:74,222,128}
html[data-theme=purple]{--player-accent:#a879ff;--player-accent2:#7b5bff;--player-rgb:168,121,255}
html[data-theme=blue]{--player-accent:#38bdf8;--player-accent2:#0ea5e9;--player-rgb:56,189,248}
html[data-theme=red]{--player-accent:#f87171;--player-accent2:#ef4444;--player-rgb:248,113,113}
html[data-theme=amber]{--player-accent:#fbbf24;--player-accent2:#f59e0b;--player-rgb:251,191,36}
body{background:radial-gradient(circle at 50% 5%,rgba(var(--player-rgb),.12),transparent 35%),linear-gradient(145deg,#101722,#182437 48%,#24364e);color:#eef2f8}
.player-page{min-height:100vh;padding:18px 18px 40px 86px}.player-wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:160px minmax(0,1fr) 160px;gap:14px;align-items:start}.player-sidebar{position:fixed;left:12px;top:12px;bottom:12px;width:64px;padding:10px 7px;background:linear-gradient(180deg,rgba(25,29,33,.97),rgba(17,20,23,.97));border:1px solid var(--player-accent);border-radius:19px;box-shadow:0 18px 45px #0007,0 0 20px rgba(var(--player-rgb),.12);z-index:20;display:flex;flex-direction:column}.player-nav{display:flex;flex-direction:column;gap:6px;height:100%}.player-nav a,.player-nav button{width:100%;height:44px;min-height:44px;border:1px solid transparent;border-radius:12px;background:transparent;color:#aab4c4;display:grid;place-items:center;text-decoration:none;font-size:18px;cursor:pointer}.player-nav .profile{height:52px;min-height:52px;background:#252d3a;color:#d9e2ef;margin-bottom:5px}.player-nav a:hover,.player-nav button:hover{background:rgba(var(--player-rgb),.12);color:#fff;border-color:rgba(var(--player-rgb),.3)}.player-nav a.active{background:var(--player-accent);color:#07100b;border-color:var(--player-accent);box-shadow:0 8px 22px rgba(var(--player-rgb),.25)}.player-nav .settings{margin-top:auto}.side-games{display:flex;flex-direction:column;gap:10px}.side-game{display:block;color:#fff;text-decoration:none;background:#111923;border:1px solid rgba(255,255,255,.12);border-radius:13px;overflow:hidden}.side-game:hover{border-color:var(--player-accent);transform:translateY(-1px)}.side-game img{width:100%;height:92px;object-fit:cover;display:block;background:#070a0e}.side-game span{display:block;padding:7px 8px 9px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-card{background:#000;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px #0008}.frame{position:relative;aspect-ratio:16/9;background:#000}.frame iframe{width:100%;height:100%;border:0;display:block}.loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#000;color:#c7ccd6}.loading .inner{text-align:center}.spinner{width:38px;height:38px;border:3px solid #ffffff26;border-top-color:var(--player-accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#eef0f4;color:#222}.titleline{display:flex;align-items:center;gap:9px;min-width:0}.titleline img{width:26px;height:26px;border-radius:6px}.titleline strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.titleline small{display:block;color:#777;font-size:11px}.actions{display:flex;gap:7px;align-items:center}.vote{height:36px;min-width:64px;border:1px solid #d5d7dc;border-radius:10px;background:#fff;color:#555;cursor:pointer}.vote.active{border-color:var(--player-accent);color:#08753b;background:rgba(var(--player-rgb),.1)}.round{width:36px;height:36px;border:1px solid #d5d7dc;border-radius:10px;background:#fff;color:#444;cursor:pointer}.comments{margin-top:14px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:16px}.comments h3{margin:0 0 10px;font-size:15px}.comments textarea{width:100%;min-height:64px;resize:vertical;background:#0d141e;color:#fff;border:1px solid #334052;border-radius:10px;padding:10px;font:13px inherit}.post{margin-top:8px;border:0;border-radius:9px;background:var(--player-accent);color:#07100b;padding:9px 14px;font-weight:800;cursor:pointer}.comment{margin-top:10px;padding:10px 12px;background:#0c131d;border-radius:10px;font-size:13px}.comment small{display:block;color:#8792a3;margin-top:4px}.locked,.empty{color:#a9b2c3;background:#0d141e;border-radius:10px;padding:12px;font-size:13px}.app-player .player-wrap{grid-template-columns:minmax(0,1fr)}.app-player .frame{aspect-ratio:16/9;min-height:calc(100vh - 110px)}.app-player .player-card{width:100%}.app-player .player-page{padding-right:18px}.app-player .bar{display:none}
@media(max-width:1050px){.player-wrap{grid-template-columns:1fr}.side-games{display:none}.player-page{padding-left:84px;padding-right:12px}.player-card{max-width:1100px;margin:auto}}
@media(max-width:650px){.player-sidebar{left:8px;top:8px;bottom:8px;width:54px;padding:8px 6px;border-radius:16px}.player-nav a,.player-nav button{height:42px;min-height:42px}.player-nav .profile{height:48px;min-height:48px}.player-page{padding-left:70px;padding-right:8px;padding-top:8px}.bar{padding:9px}.vote{min-width:52px}.side-games{display:none}}
</style>
</head>
<body id="playerBody">
<nav class="player-sidebar" aria-label="Main navigation">
 <div class="player-nav">
  <div class="profile" title="Profile"><i class="bi bi-person-fill"></i></div>
  <a href="index.html" title="Home"><i class="bi bi-house-fill"></i></a>
  <a href="index.html#apps" id="appsNav" title="Apps"><i class="bi bi-grid-1x2-fill"></i></a>
  <a href="index.html" id="gamesNav" title="Games"><i class="bi bi-controller"></i></a>
  <button type="button" title="Info" onclick="alert('Unblocked Games player')"><i class="bi bi-info-circle-fill"></i></button>
  <button type="button" class="settings" title="Settings" onclick="location.href='index.html'"><i class="bi bi-gear-fill"></i></button>
 </div>
</nav>
<main class="player-page"><div class="player-wrap">
 <aside class="side-games" id="leftGames"></aside>
 <section>
  <div class="player-card">
   <div class="frame"><div class="loading" id="loading"><div class="inner"><div class="spinner"></div><div>Loading...</div></div></div><iframe id="playerFrame" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope; web-share" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></div>
   <div class="bar" id="bar"><div class="titleline"><img id="favicon" alt=""><div><strong id="title">Loading...</strong><small>Hosted externally</small></div></div><div class="actions"><button class="vote" id="likeBtn"><i class="bi bi-hand-thumbs-up-fill"></i> <span id="likes">0</span></button><button class="vote" id="dislikeBtn"><i class="bi bi-hand-thumbs-down-fill"></i> <span id="dislikes">0</span></button><button class="round" id="refreshBtn" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button><button class="round" id="fullscreenBtn" title="Fullscreen"><i class="bi bi-arrows-fullscreen"></i></button></div></div>
  </div>
  <section class="comments" id="comments"><h3>Comments</h3><div id="commentArea"></div><div id="commentList" class="comment-list"></div></section>
 </section>
 <aside class="side-games" id="rightGames"></aside>
</div></main>
<script>
const params=new URLSearchParams(location.search);const type=params.get('type')==='app'?'app':'game';const target=params.get('url')||'https://www.google.com';const title=decodeURIComponent(params.get('title')||'Player');
const $=id=>document.getElementById(id);const frame=$('playerFrame');const loading=$('loading');
const theme=localStorage.getItem('ug_theme')||'green';document.documentElement.setAttribute('data-theme',theme);document.body.classList.toggle('app-player',type==='app');$('appsNav').classList.toggle('active',type==='app');$('gamesNav').classList.toggle('active',type==='game');
$('title').textContent=title;$('favicon').src='https://www.google.com/s2/favicons?sz=128&domain='+encodeURIComponent((()=>{try{return new URL(target).hostname}catch{return ''}})());if(type==='app'){document.querySelector('.side-games')?.remove();document.querySelectorAll('.side-games').forEach(x=>x.remove());$('bar').remove();$('comments').remove();}
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function startProxy(){
 const mode=localStorage.getItem('ug_proxy')||'utopia';
 if(mode!=='utopia'){frame.src=target;return;}
 try{
  await navigator.serviceWorker.register(new URL('../sw.js',location.href),{scope:'/'});
  if(!navigator.serviceWorker.controller){navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});return;}
  const s=await importUV();frame.src=s.prefix+s.encodeUrl(target);
 }catch(e){frame.src=target;}
}
function importUV(){return new Promise((resolve,reject)=>{if(window.__uv$config)return resolve(window.__uv$config);const a=document.createElement('script'),b=document.createElement('script');a.src='../uv/uv.bundle.js';b.src='../uv/uv.config.js';b.onload=()=>window.__uv$config?resolve(window.__uv$config):reject(new Error('UV config unavailable'));b.onerror=reject;document.head.append(a,b);a.onload=()=>{};});}
frame.addEventListener('load',()=>loading.style.display='none');$('refreshBtn').onclick=()=>{loading.style.display='grid';frame.src=frame.src};$('fullscreenBtn').onclick=()=>frame.requestFullscreen?.();
let vote={likes:0,dislikes:0,myVote:null};async function loadVotes(){try{const r=await fetch('/api/votes',{credentials:'include'});const d=await r.json();vote=d.votes?.[target]||vote;renderVotes()}catch{}}
function renderVotes(){$('likes').textContent=vote.likes||0;$('dislikes').textContent=vote.dislikes||0;$('likeBtn').classList.toggle('active',vote.myVote==='like');$('dislikeBtn').classList.toggle('active',vote.myVote==='dislike')}
async function doVote(kind){try{const r=await fetch('/api/vote',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:target,type:kind})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Please log in to vote.');vote=d.vote;renderVotes()}catch(e){alert(e.message)}}
$('likeBtn').onclick=()=>doVote('like');$('dislikeBtn').onclick=()=>doVote('dislike');
async function loadComments(){const area=$('commentArea');try{const me=await fetch('/api/me',{credentials:'include'}).then(r=>r.json());area.innerHTML=me.user?'<textarea id="commentInput" placeholder="Leave a comment..."></textarea><button class="post" id="post">Post comment</button>':'<div class="locked"><i class="bi bi-lock-fill"></i> Log in to leave a comment.</div>'}catch{area.innerHTML='<div class="locked">Log in to leave a comment.</div>'}try{const r=await fetch('/api/comments?url='+encodeURIComponent(target));const d=await r.json();const list=d.comments||[];$('commentList').innerHTML=list.length?list.slice().reverse().map(c=>`<div class="comment"><strong>${escapeHTML(c.author)}</strong><div>${escapeHTML(c.text)}</div><small>${escapeHTML(c.date)}</small></div>`).join(''):'<div class="empty">No comments yet.</div>'}catch{}}
$('commentArea').addEventListener('click',async e=>{if(e.target.id!=='post')return;const input=$('commentInput');const text=input.value.trim();if(!text)return;const r=await fetch('/api/comments',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:target,text})});if(!r.ok){alert('Could not post comment.');return}input.value='';loadComments()});
async function loadSideGames(){if(type!=='game')return;try{const list=await fetch('games.json').then(r=>r.json());const others=list.filter(g=>g.url!==target).sort(()=>Math.random()-.5).slice(0,8);function card(g){const img=g.thumbnail||'https://www.google.com/s2/favicons?sz=128&domain='+new URL(g.url).hostname;return `<a class="side-game" href="player.html?type=game&url=${encodeURIComponent(g.url)}&title=${encodeURIComponent(g.name)}"><img src="${escapeHTML(img)}"><span>${escapeHTML(g.name)}</span></a>`} $('leftGames').innerHTML=others.slice(0,4).map(card).join('');$('rightGames').innerHTML=others.slice(4).map(card).join('')}catch{}}
startProxy();if(type==='game'){loadVotes();loadComments();loadSideGames()}
</script>
</body></html>
