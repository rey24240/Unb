<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Game Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="browser.css">
</head>
<body class="game-player-page">
<div class="game-player-shell">
  <header class="player-topbar">
    <button class="player-back" id="homeBtn" title="Back to Games" aria-label="Back to Games"><i class="bi bi-chevron-left"></i></button>
    <div class="player-heading"><span id="playerTitle">Game</span><small id="playerCategory">Game</small></div>
    <div class="player-actions">
      <button class="player-action vote-action" id="likeBtn" title="Like"><i class="bi bi-hand-thumbs-up-fill"></i><span id="likeCount">0</span></button>
      <button class="player-action vote-action" id="dislikeBtn" title="Dislike"><i class="bi bi-hand-thumbs-down-fill"></i><span id="dislikeCount">0</span></button>
      <button class="player-action" id="reloadBtn" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
      <button class="player-action" id="favoriteBtn" title="Favorite"><i class="bi bi-heart"></i></button>
      <button class="player-action" id="fullscreenBtn" title="Fullscreen"><i class="bi bi-arrows-fullscreen"></i></button>
      <button class="player-action" id="saveBtn" title="Save Data"><i class="bi bi-floppy-fill"></i></button>
    </div>
  </header>

  <section class="player-frame-card" id="playerFrameCard">
    <div class="frame-wrap">
      <div class="loading" id="loading"><div class="spinner"></div><span id="loadingText">Loading...</span></div>
      <iframe id="webFrame" title="Game" allow="fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; accelerometer; gyroscope; web-share" referrerpolicy="no-referrer" allowfullscreen></iframe>
    </div>
  </section>
</div>

<div class="save-panel" id="savePanel" aria-hidden="true">
  <div class="save-card">
    <div class="save-head"><div><strong>Save Data</strong><small id="saveStatus">Saved data stays on this device.</small></div><button id="saveClose" class="save-close" aria-label="Close">×</button></div>
    <button id="saveNow" class="save-action"><i class="bi bi-floppy-fill"></i> Save Now</button>
    <button id="loadSave" class="save-action"><i class="bi bi-arrow-counterclockwise"></i> Load Save</button>
    <div class="save-row"><button id="exportSave" class="save-action secondary"><i class="bi bi-download"></i> Export</button><button id="importSave" class="save-action secondary"><i class="bi bi-upload"></i> Import</button><input id="saveFile" type="file" accept="application/json,.json" hidden></div>
    <button id="deleteSave" class="save-action danger"><i class="bi bi-trash3"></i> Delete Save</button>
    <p class="save-note">Automatic saving is enabled when the game exposes browser save storage through the proxy.</p>
  </div>
</div>

<script src="uv/uv.bundle.js"></script>
<script src="uv/uv.config.js"></script>
<script src="save-data.js"></script>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const gameUrl=params.get('url')||'';
  const title=params.get('title')||'Game';
  const type=params.get('type')||'game';
  const frame=document.getElementById('webFrame');
  const loading=document.getElementById('loading');
  const loadingText=document.getElementById('loadingText');
  const titleEl=document.getElementById('playerTitle');
  const categoryEl=document.getElementById('playerCategory');
  const favKey='ug_favorites';
  const voteKey='ug_votes_'+encodeURIComponent(gameUrl);
  let currentProxyUrl='';

  titleEl.textContent=title; document.title=title+' — Game Player';
  categoryEl.textContent=type==='app'?'App':'Game';
  window.__currentGameUrl=gameUrl;

  function favoriteSet(){try{return new Set(JSON.parse(localStorage.getItem(favKey)||'[]'))}catch(_){return new Set()}}
  function setFavorite(on){const s=favoriteSet();on?s.add(gameUrl):s.delete(gameUrl);localStorage.setItem(favKey,JSON.stringify([...s]));const b=document.getElementById('favoriteBtn');b.classList.toggle('active',on);b.innerHTML='<i class="bi '+(on?'bi-heart-fill':'bi-heart')+'"></i>'}
  document.getElementById('favoriteBtn').addEventListener('click',()=>setFavorite(!favoriteSet().has(gameUrl)));
  setFavorite(favoriteSet().has(gameUrl));

  function localVotes(){try{return JSON.parse(localStorage.getItem(voteKey)||'{"likes":0,"dislikes":0,"voters":{}}')}catch(_){return {likes:0,dislikes:0,voters:{}}}}
  function userKey(){return localStorage.getItem('ug_current_user')||'device'}
  function renderVotes(v){const who=v.myVote||v.voters?.[userKey()]||null;document.getElementById('likeCount').textContent=v.likes||0;document.getElementById('dislikeCount').textContent=v.dislikes||0;document.getElementById('likeBtn').classList.toggle('active-like',who==='like');document.getElementById('dislikeBtn').classList.toggle('active-dislike',who==='dislike')}
  async function loadVotes(){
    const local=localVotes(); renderVotes(local);
    try{const r=await fetch('/api/votes',{credentials:'same-origin'});if(!r.ok)return;const d=await r.json();if(d.votes?.[gameUrl])renderVotes(d.votes[gameUrl]);}catch(_){}
  }
  async function vote(type){
    const v=localVotes(), key=userKey(), old=v.voters?.[key]||null;
    if(old===type){v[type==='like'?'likes':'dislikes']=Math.max(0,(v[type==='like'?'likes':'dislikes']||0)-1);delete v.voters[key];v.myVote=null}
    else{if(old)v[old==='like'?'likes':'dislikes']=Math.max(0,(v[old==='like'?'likes':'dislikes']||0)-1);v[type==='like'?'likes':'dislikes']=(v[type==='like'?'likes':'dislikes']||0)+1;v.voters[key]=type;v.myVote=type}
    localStorage.setItem(voteKey,JSON.stringify(v)); renderVotes(v);
    try{const r=await fetch('/api/vote',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:gameUrl,type})});if(r.ok){const d=await r.json();if(d.vote)renderVotes(d.vote)}}catch(_){}
  }
  document.getElementById('likeBtn').addEventListener('click',()=>vote('like'));
  document.getElementById('dislikeBtn').addEventListener('click',()=>vote('dislike'));

  function showLoading(text='Loading...'){loadingText.textContent=text;loading.classList.remove('hidden')}
  function hideLoading(){loading.classList.add('hidden')}
  function showProxyError(){ loadingText.textContent='Proxy could not load this site. Try Refresh.'; loading.classList.remove('hidden'); }
  frame.addEventListener('load',hideLoading);

  async function registerProxy(){
    if(!('serviceWorker' in navigator)) throw new Error('Service workers are not supported here.');
    const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});
    await reg.update().catch(()=>{});
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller){
      const key='ug_sw_reload_once';
      if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');location.reload();return false;}
      throw new Error('Proxy service worker did not take control of the page.');
    }
    sessionStorage.removeItem('ug_sw_reload_once');
    return true;
  }
  async function loadGame(){
    if(!gameUrl){showLoading('No game URL');return}
    showLoading('Loading...');
    try{
      const controlled=await registerProxy();
      if(controlled===false)return;
      const cfg=window.__uv$config;
      if(!cfg)throw new Error('Proxy configuration is missing.');
      currentProxyUrl=cfg.prefix+cfg.encodeUrl(gameUrl);
      frame.src=currentProxyUrl;
      setTimeout(()=>{if(!frame.src||frame.src==='about:blank')showLoading('Loading...')},250);
    }catch(err){
      console.error(err);
      frame.src=gameUrl;
      showLoading('Proxy unavailable — trying direct connection...');
      setTimeout(()=>{ try { if(frame.contentDocument && frame.contentDocument.body && frame.contentDocument.body.innerHTML.trim()) hideLoading(); else showProxyError(); } catch(_) { showProxyError(); } },3500);
    }
  }
  document.getElementById('reloadBtn').addEventListener('click',()=>{showLoading('Refreshing...');if(currentProxyUrl)frame.src=currentProxyUrl;else loadGame()});
  document.getElementById('fullscreenBtn').addEventListener('click',()=>{const target=frame;try{target.requestFullscreen?.()}catch(_){try{target.webkitRequestFullscreen?.()}catch(__){}}});
  document.getElementById('homeBtn').addEventListener('click',()=>location.href='/');

  fetch('/unblocked-games/games.json').then(r=>r.json()).then(gs=>{const g=gs.find(x=>x.url===gameUrl);if(g){categoryEl.textContent=(g.categories||[]).join(' • ')|| (type==='app'?'App':'Game')}}).catch(()=>{});
  loadVotes();
  loadGame();
})();
</script>
</body>
</html>
