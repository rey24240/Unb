<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unblocked Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="side-item logo-item">
    <span class="side-icon">🎮</span>
    <span class="side-label">Unblocked Games</span>
  </div>

  <div class="side-item active" data-target="home">
    <span class="side-icon">🏠</span>
    <span class="side-label">Home</span>
  </div>
  <div class="side-item" id="infoBtn">
    <span class="side-icon">ℹ️</span>
    <span class="side-label">Info</span>
  </div>
  <div class="side-item" id="settingsBtn">
    <span class="side-icon">⚙️</span>
    <span class="side-label">Settings</span>
  </div>
</nav>

<main class="main" id="home">
  <section class="hero-center">
    <h1 class="brand-title">UNBLOCKED GAMES</h1>
    <div class="beta-tag" id="betaTag">Beta</div>

    <form class="search-bar" id="searchForm">
      <input type="text" id="searchInput" placeholder="Search Google or Enter a Link" autocomplete="off">
    </form>

    <button class="games-btn" id="gamesBtn">Games</button>
  </section>

  <section class="games-section" id="games">
    <div class="section-head">
      <h2>Games</h2>
    </div>

    <div class="games-controls">
      <div class="games-search">
        🔍 <input type="text" id="gameSearch" placeholder="Search games...">
      </div>
      <select id="categorySelect" class="category-select">
        <option value="All">All Categories</option>
      </select>
    </div>

    <div class="grid" id="grid"></div>
    <p class="empty-note" id="emptyNote" style="display:none;">No games match that search.</p>
  </section>
</main>

<a class="github-pill" href="https://github.com/rey24240/Unblocked-games-" target="_blank" rel="noopener">
  ⭐ GitHub
</a>

<div class="status-widget">
  <div>FPS: <span id="fpsVal">60</span></div>
  <div id="clockRow">--:--</div>
</div>

<!-- Settings / theme panel -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <button class="modal-close" id="settingsClose">✕</button>
    <h3 class="modal-title">Theme</h3>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
</div>

<script>
document.getElementById('infoBtn').addEventListener('click', () => {
  alert('Unblocked Games — a simple search page.');
});

/* ---------- Theme switcher ---------- */
const themes = [
  {id:"green",  name:"Grey / Green", swatch:"#4ade80"},
  {id:"purple", name:"Nova Purple",  swatch:"#a879ff"},
  {id:"blue",   name:"Ocean Blue",   swatch:"#38bdf8"},
  {id:"red",    name:"Ember Red",    swatch:"#f87171"},
  {id:"amber",  name:"Retro Amber",  swatch:"#fbbf24"},
];

const settingsOverlay = document.getElementById('settingsOverlay');
const themeGrid = document.getElementById('themeGrid');

function applyTheme(id){
  document.documentElement.setAttribute('data-theme', id);
  localStorage.setItem('ug_theme', id);
  document.querySelectorAll('.theme-swatch').forEach(el => {
    el.classList.toggle('selected', el.dataset.theme === id);
  });
}

themes.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'theme-swatch';
  btn.dataset.theme = t.id;
  btn.innerHTML = `<span class="swatch-dot" style="background:${t.swatch}"></span>${t.name}`;
  btn.addEventListener('click', () => applyTheme(t.id));
  themeGrid.appendChild(btn);
});

const savedTheme = localStorage.getItem('ug_theme') || 'green';
applyTheme(savedTheme);

document.getElementById('settingsBtn').addEventListener('click', () => {
  settingsOverlay.classList.add('open');
});
document.getElementById('settingsClose').addEventListener('click', () => {
  settingsOverlay.classList.remove('open');
});
settingsOverlay.addEventListener('click', e => {
  if(e.target === settingsOverlay) settingsOverlay.classList.remove('open');
});

/* Rotating beta tag text */
const betaPhrases = [
  "Beta", "v0.2 Beta", "Early Access", "Work in Progress",
  "Beta Build", "Testing Phase", "Under Construction", "Still Cooking"
];
const betaTag = document.getElementById('betaTag');
function rotateBeta(){
  const next = betaPhrases[Math.floor(Math.random() * betaPhrases.length)];
  betaTag.style.opacity = 0;
  setTimeout(() => {
    betaTag.textContent = next;
    betaTag.style.opacity = 1;
  }, 250);
}
rotateBeta();
setInterval(rotateBeta, 4000);

document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const val = document.getElementById('searchInput').value.trim();
  if(!val) return;
  const looksLikeUrl = /^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(val);
  if(looksLikeUrl){
    window.location.href = val.startsWith('http') ? val : 'https://' + val;
  } else {
    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
  }
});

document.getElementById('gamesBtn').addEventListener('click', () => {
  document.getElementById('games').scrollIntoView({behavior:'smooth', block:'start'});
});

/* Live clock */
function updateClock(){
  const d = new Date();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clockRow').textContent = `${h}:${m} ${ampm}`;
}
updateClock();
setInterval(updateClock, 1000 * 15);

/* FPS counter */
let lastFrame = performance.now();
let frames = 0;
let fpsAcc = 0;
function fpsLoop(now){
  frames++;
  fpsAcc += now - lastFrame;
  lastFrame = now;
  if(fpsAcc > 500){
    document.getElementById('fpsVal').textContent = Math.round((frames * 1000) / fpsAcc);
    frames = 0;
    fpsAcc = 0;
  }
  requestAnimationFrame(fpsLoop);
}
requestAnimationFrame(fpsLoop);

/* ---------- Games data ----------
   Edit this list to match the game files you added.
   file: the path to your game's HTML file (relative to this folder)
   cat: category shown in the filter dropdown
--------------------------------------------------- */
const games = [
  // Example — replace with your real files:
  // {name:"Snake", cat:"Arcade", file:"games/snake.html", icon:"🐍"},
  // {name:"Tetris", cat:"Puzzle", file:"games/tetris.html", icon:"🟦"},
];

const grid = document.getElementById('grid');
const emptyNote = document.getElementById('emptyNote');
const gameSearch = document.getElementById('gameSearch');
const categorySelect = document.getElementById('categorySelect');

function populateCategories(){
  const cats = ["All", ...new Set(games.map(g => g.cat))];
  categorySelect.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

function cardHTML(g){
  return `
    <a class="card" href="${g.file}">
      <div class="thumb">${g.icon || '🎮'}</div>
      <div class="card-info">
        <div class="name">${g.name}</div>
        <div class="cat">${g.cat}</div>
      </div>
    </a>
  `;
}

function renderGrid(){
  const query = gameSearch.value.trim().toLowerCase();
  const cat = categorySelect.value;
  const filtered = games.filter(g => {
    const matchesQuery = g.name.toLowerCase().includes(query);
    const matchesCat = cat === 'All' || g.cat === cat;
    return matchesQuery && matchesCat;
  });
  grid.innerHTML = filtered.map(cardHTML).join('');
  emptyNote.style.display = filtered.length === 0 ? 'block' : 'none';
  emptyNote.textContent = games.length === 0
    ? 'No games added yet — edit the games list in games.html to add yours.'
    : 'No games match that search.';
}

populateCategories();
renderGrid();
gameSearch.addEventListener('input', renderGrid);
categorySelect.addEventListener('change', renderGrid);
</script>

</body>
</html>
