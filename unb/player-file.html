<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:#000;color:#eef2f8;padding-bottom:82px}.player-page{min-height:calc(100vh - 82px);padding:22px}.player-wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:160px minmax(0,1fr) 160px;gap:16px}.side-games{display:none}.player-card{background:#000;border:1px solid rgba(74,222,128,.2);border-radius:18px;overflow:hidden;box-shadow:0 24px 70px #0008}.frame{position:relative;aspect-ratio:16/9}.frame iframe{width:100%;height:100%;border:0;display:block}.loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#000}.spinner{width:42px;height:42px;border:3px solid #ffffff22;border-top-color:#4ade80;border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#101722;border-top:1px solid rgba(74,222,128,.16)}.titleline{display:flex;align-items:center;gap:9px;min-width:0}.titleline img{width:28px;height:28px;border-radius:7px}.titleline strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.titleline small{display:block;color:#9ba8b8;font-size:11px}.actions{display:flex;gap:7px}.round{width:38px;height:38px;border:1px solid rgba(74,222,128,.28);border-radius:10px;background:rgba(74,222,128,.06);color:#dce6ef;cursor:pointer}.player-bottom-nav{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:50;display:flex;justify-content:center;align-items:center;gap:6px;padding:0 14px;background:rgba(13,17,23,.94);backdrop-filter:blur(18px);border-top:1px solid rgba(74,222,128,.22)}.player-bottom-nav a{min-width:105px;height:46px;padding:0 14px;border-radius:12px;color:#9ca8b8;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;font:700 13px Rubik,system-ui}.player-bottom-nav a.active{color:#fff;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.3)}.player-bottom-nav i{font-size:17px}@media(max-width:1050px){.player-wrap{grid-template-columns:1fr}}@media(max-width:700px){.player-page{padding:12px 8px 20px}.player-bottom-nav{height:62px;gap:2px;padding:0 5px}.player-bottom-nav a{min-width:0;flex:1;height:44px;padding:0 5px;font-size:10px;flex-direction:column;gap:3px}.player-bottom-nav i{font-size:16px}.bar{padding:9px}}
</style>
<style>.player-wrap{grid-template-columns:minmax(0,1fr)}</style>
<style>.player-card{position:relative}#fullscreenBtn{position:absolute;top:5px;right:12px;z-index:4;background:rgba(10,15,22,.78);backdrop-filter:blur(6px)}</style>
<style>.player-page{height:calc(100vh - 82px);min-height:0;overflow:hidden}.player-wrap{height:100%}.player-wrap>section,.player-card{min-height:0}.player-card{height:100%;display:flex;flex-direction:column}.frame{flex:1;min-height:0;aspect-ratio:auto}</style>
<style>#favoriteBtn.active{color:#4ade80;border-color:#4ade80;background:rgba(74,222,128,.12)}</style>
<style>#fullscreenBtn{position:static;background:rgba(74,222,128,.06);backdrop-filter:none}.favorite-label{width:auto;padding:0 12px;display:inline-flex;align-items:center;gap:6px}</style>
</head>
<body>
<main class="player-page"><div class="player-wrap"><section><div class="player-card"><div class="frame"><div class="loading" id="loading"><div><div class="spinner"></div><div id="loadingText">Loading file...</div></div></div><iframe id="playerFrame" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope; web-share" allowfullscreen referrerpolicy="no-referrer"></iframe></div><div class="bar"><div class="titleline"><img id="favicon" alt=""><div><strong id="title">Loading...</strong><small>Local file</small></div></div><div class="actions"><button class="round" id="refreshBtn" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button><button class="round" id="fullscreenBtn" title="Fullscreen"><i class="bi bi-arrows-fullscreen"></i></button></div></div></div></section></div></main>
<nav class="player-bottom-nav" aria-label="Main navigation"><a href="/index.html"><i class="bi bi-house-fill"></i><span>Home</span></a><a href="/index.html" class="active"><i class="bi bi-controller"></i><span>Games</span></a><a href="/index.html#favorites"><i class="bi bi-heart"></i><span>Favorites</span></a><a href="/index.html#apps"><i class="bi bi-grid-1x2-fill"></i><span>Apps</span></a></nav>
<script>
const params=new URLSearchParams(location.search);const target=params.get('file')||params.get('url')||'';const title=decodeURIComponent(params.get('title')||'Local file');const frame=document.getElementById('playerFrame');document.getElementById('title').textContent=title;document.title=title;frame.src=target;frame.addEventListener('load',()=>document.getElementById('loading').style.display='none');document.getElementById('refreshBtn').onclick=()=>{frame.src=target};document.getElementById('fullscreenBtn').onclick=()=>frame.requestFullscreen?.();
</script>
<script>
const favoriteButton=document.createElement('button');favoriteButton.className='round';favoriteButton.id='favoriteBtn';favoriteButton.type='button';favoriteButton.title='Favorite';favoriteButton.setAttribute('aria-label','Favorite');const refreshButton=document.getElementById('refreshBtn');refreshButton.parentNode.insertBefore(favoriteButton,refreshButton);const favorites=()=>new Set(JSON.parse(localStorage.getItem('ug_favorites')||'[]'));function renderFavorite(){const saved=favorites().has(target);favoriteButton.classList.toggle('active',saved);favoriteButton.innerHTML=`<i class="bi ${saved?'bi-star-fill':'bi-star'}"></i>`;favoriteButton.title=saved?'Remove from favorites':'Add to favorites';favoriteButton.setAttribute('aria-label',favoriteButton.title)}favoriteButton.onclick=()=>{const saved=favorites();saved.has(target)?saved.delete(target):saved.add(target);localStorage.setItem('ug_favorites',JSON.stringify([...saved]));renderFavorite()};renderFavorite();
</script>
<script>
favoriteButton.classList.add('favorite-label');function renderFavoriteLabel(){const saved=favorites().has(target);favoriteButton.innerHTML=`<i class="bi ${saved?'bi-star-fill':'bi-star'}"></i> ${saved?'Favorited':'Favorite'}`}favoriteButton.addEventListener('click',()=>setTimeout(renderFavoriteLabel,0));renderFavoriteLabel();
</script>
</body>
</html>
