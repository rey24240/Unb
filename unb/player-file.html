<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
#playerFrame{width:100%;height:100%;border:0;display:block}
#loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:linear-gradient(145deg,#101722,#182437);color:#eef2f8;font:600 16px system-ui,sans-serif;transition:opacity .2s ease}
#loading.hidden{opacity:0;pointer-events:none}
#loadingInner{text-align:center}
#loadingNotice{display:none;max-width:320px;margin:14px auto 0;color:#cbd5e1;font-size:13px;font-weight:400;line-height:1.45}
#loadingNotice.visible{display:block}
#spinner{width:42px;height:42px;margin:0 auto 14px;border:3px solid #ffffff25;border-top-color:#4ade80;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite"><div id="loadingInner"><div id="spinner"></div><div id="loadingText">Loading game...</div><div id="loadingNotice">This game is taking a while to load. It might be slow or unavailable.</div></div></div>
<iframe id="playerFrame" src="about:blank" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope; web-share" allowfullscreen referrerpolicy="no-referrer"></iframe>
<script>
const params=new URLSearchParams(location.search);
const useProxy=params.get('proxy')==='true';
const rawTarget=params.get('file')||params.get('url')||'';
const target=useProxy&&!/^(https?:\/\/|\/|\.\/|\.\.\/)/i.test(rawTarget)?`https://${rawTarget}`:rawTarget;
const title=decodeURIComponent(params.get('title')||'Game');
document.title=title;
const frame=document.getElementById('playerFrame');
const loading=document.getElementById('loading');
const loadingNotice=document.getElementById('loadingNotice');
async function loadTarget(){
	if(!target)return;
	const warningTimer=setTimeout(()=>loadingNotice.classList.add('visible'),8000);
	frame.addEventListener('load',()=>{
		clearTimeout(warningTimer);
		loading.classList.add('hidden');
	},{once:true});
	if(!useProxy){frame.src=target;return}
	try{
		await navigator.serviceWorker.register(new URL('../sw.js',location.href),{scope:'/'});
		if(!navigator.serviceWorker.controller){
			navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});
			return;
		}
		if(!window.__uv$config){
			await new Promise((resolve,reject)=>{
				const bundle=document.createElement('script'),config=document.createElement('script');
				bundle.src='../uv/uv.bundle.js';config.src='../uv/uv.config.js';
				config.onload=()=>window.__uv$config?resolve():reject(new Error('UV config unavailable'));config.onerror=reject;
				document.head.append(bundle,config);
			});
		}
		frame.src=window.__uv$config.prefix+window.__uv$config.encodeUrl(target);
	}catch{frame.src=target}
}
if(target){
	loadTarget();
}else{
	document.getElementById('loadingText').textContent='No game selected';
	document.getElementById('spinner').style.display='none';
}
</script>
</body>
</html>
